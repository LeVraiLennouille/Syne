<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="description" content="Jeu coopératif à deux joueurs inspiré de Codenames Duet.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Duo Code">
  <title>Duo Code</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="status">
        <div class="turn">
          <span class="turn-count" id="turn-count">Tour 1</span>
          <span class="turn-label" id="turn-label"></span>
        </div>
        <div class="score" aria-live="polite"><strong id="score">0</strong> / 15</div>
      </div>
      <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
      <div class="tokens-row">
        <span id="tokens-label">Tours restants</span>
        <div class="tokens" id="tokens" role="img" aria-label="9 tours restants"></div>
      </div>
    </header>

    <main>
      <div id="board" class="board" role="grid" aria-label="Plateau de 25 mots"></div>
    </main>

    <footer class="controls">
      <label class="theme-row">
        <span>Thème</span>
        <select id="theme" aria-label="Thème des mots"></select>
      </label>
      <div class="row">
        <button id="btn-p1" class="btn secret p1" type="button">Vue Joueur 1</button>
        <button id="btn-p2" class="btn secret p2" type="button">Vue Joueur 2</button>
      </div>
      <div class="row">
        <button id="btn-end-turn" class="btn ghost" type="button">Fin du tour</button>
        <button id="btn-new" class="btn ghost" type="button">Nouvelle partie</button>
      </div>
    </footer>
  </div>

  <!-- Vue secrète -->
  <section id="secret" class="overlay secret-overlay" hidden aria-modal="true" role="dialog">
    <div class="secret-inner">
      <h2 id="secret-title">Joueur 1</h2>

      <div id="secret-cover" class="cover">
        <p id="secret-cover-text">Passez l'appareil au joueur concerné.<br>L'autre joueur ne doit pas regarder.</p>
        <button id="btn-reveal" class="btn primary" type="button">Révéler ma vue</button>
      </div>

      <div id="secret-content" hidden>
        <div class="legend">
          <span><i class="dot g"></i>9 à trouver</span>
          <span><i class="dot b"></i>3 mortelles</span>
        </div>
        <div id="secret-board" class="board secret-board"></div>
      </div>

      <button id="btn-hide" class="btn primary" type="button">Masquer l'écran</button>
    </div>
  </section>

  <!-- Résultat -->
  <section id="result" class="overlay result-overlay" hidden role="dialog" aria-modal="true">
    <div class="result-card">
      <div id="result-icon" class="result-icon" aria-hidden="true"></div>
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <button id="btn-replay" class="btn primary" type="button">Nouvelle partie</button>
      <button id="btn-view-board" class="btn ghost" type="button">Voir le plateau</button>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
